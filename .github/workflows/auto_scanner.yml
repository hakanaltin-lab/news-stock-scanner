name: Auto News Stock Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "engines/**"
      - "data/portfolio.csv"
      - "data/us_universe.json"
      - "requirements.txt"
      - ".github/workflows/auto_scanner.yml"
  schedule:
    - cron: "7,37 6-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: auto-scanner-main
  cancel-in-progress: true

jobs:
  run-scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run V8.4 scanner
      run: |
        python main.py


    - name: Commit updated reports
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"

        REPORT_FILES="docs/index.html docs/latest.csv docs/latest.json docs/last_run.txt docs/recommendation_journal.json docs/recommendation_performance.json docs/walk_forward_backtest.json docs/strategic_policy_calibration.json docs/shadow_policy_journal.json docs/historical_evidence_recovery.json"

        REPORT_TMP="$(mktemp -d)"

        for file in $REPORT_FILES; do
          if [ -f "$file" ]; then
            mkdir -p "$REPORT_TMP/$(dirname "$file")"
            cp "$file" "$REPORT_TMP/$file"
          fi
        done

        for attempt in 1 2 3; do

          echo "Report publish attempt $attempt"

          git fetch origin main

          git reset --hard origin/main

          for file in $REPORT_FILES; do
            if [ -f "$REPORT_TMP/$file" ]; then
              mkdir -p "$(dirname "$file")"
              cp "$REPORT_TMP/$file" "$file"
            fi
          done

          git add $REPORT_FILES

          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi

          git commit -m "Update V8.4 portfolio intelligence report"

          if git push origin HEAD:main; then
            echo "Report published successfully"
            exit 0
          fi

          echo "Push raced with another update; retrying on latest main"

        done

        echo "Failed to publish reports after 3 attempts"
        exit 1
