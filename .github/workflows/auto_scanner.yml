name: Auto News Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 6-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: auto-news-stock-scanner-main
  cancel-in-progress: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner automatically
        run: |
          python news_stock_scanner_v2.py --source both --hours 12 --universe full --top 10

      - name: Publish latest report into docs folder
        run: |
          mkdir -p docs
          cp news_stock_report_v20.html docs/index.html
          cp news_stock_opportunities_v20.csv docs/latest.csv
          date -u +"Last automatic run: %Y-%m-%d %H:%M UTC" > docs/last_run.txt

      - name: Commit updated reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/index.html docs/latest.csv docs/last_run.txt

          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi

          git commit -m "Update automatic stock scanner report"
          git push
