name: Auto News Stock Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "engines/**"
      - "data/portfolio.csv"
      - "data/us_universe.json"
      - "requirements.txt"
      - ".github/workflows/auto_scanner.yml"
  schedule:
    - cron: "7,37 6-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: auto-scanner-main
  cancel-in-progress: true

jobs:
  run-scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run V8.2 scanner
      run: |
        python main.py


    - name: Commit updated reports
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"

        git add docs/index.html docs/latest.csv docs/latest.json docs/last_run.txt docs/recommendation_journal.json docs/recommendation_performance.json docs/walk_forward_backtest.json docs/strategic_policy_calibration.json docs/shadow_policy_journal.json

        if git diff --cached --quiet; then
          echo "No report changes"
          exit 0
        fi

        git commit -m "Update V8.2 portfolio intelligence report"

        git pull --rebase origin main

        git push
