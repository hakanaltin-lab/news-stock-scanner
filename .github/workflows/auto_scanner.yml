name: Auto News Stock Scanner

on:
  schedule:
    # Doha / Türkiye 10:00 = UTC 07:00, Monday-Friday
    - cron: "0 7 * * 1-5"
    # Doha / Türkiye 17:00 = UTC 14:00, Monday-Friday
    - cron: "0 14 * * 1-5"

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner automatically
        run: |
          python news_stock_scanner_v2.py --source both --hours 12 --universe core --top 20

      - name: Publish latest report into docs folder
        run: |
          mkdir -p docs
          cp news_stock_report_v20.html docs/index.html
          cp news_stock_opportunities_v20.csv docs/latest.csv
          date -u +"Last automatic run: %Y-%m-%d %H:%M UTC" > docs/last_run.txt

      - name: Commit updated reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/index.html docs/latest.csv docs/last_run.txt
          git commit -m "Update automatic stock scanner report" || echo "No report changes to commit"
          git push
