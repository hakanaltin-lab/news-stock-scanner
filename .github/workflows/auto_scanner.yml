name: Auto News Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 6-21 * * 1-5"

permissions:
  contents: write

jobs:
  run-scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run V5 scanner
      run: |
        python main.py


    - name: Commit updated reports
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"

        git add docs/index.html docs/latest.csv docs/latest.json docs/last_run.txt

        if git diff --cached --quiet; then
          echo "No report changes"
          exit 0
        fi

        git commit -m "Update V5 portfolio intelligence report"

        git push
