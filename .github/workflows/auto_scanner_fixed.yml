name: Auto News Stock Scanner

on:
  push:
    branches: ["main"]
    paths:
      - "news_stock_scanner_v2.py"
      - "requirements.txt"
      - ".github/workflows/auto_scanner.yml"
  workflow_dispatch:
  schedule:
    # Doha / Türkiye 10:17 = UTC 07:17, Monday-Friday
    - cron: "17 7 * * 1-5"
    # Doha / Türkiye 17:17 = UTC 14:17, Monday-Friday
    - cron: "17 14 * * 1-5"

permissions:
  contents: write

jobs:
  run-scanner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner automatically
        run: |
          python news_stock_scanner_v2.py --source both --hours 12 --universe core --top 20

      - name: Publish latest report into docs folder
        run: |
          mkdir -p docs
          cp news_stock_report_v20.html docs/index.html
          cp news_stock_opportunities_v20.csv docs/latest.csv
          date -u +"Last automatic run: %Y-%m-%d %H:%M UTC" > docs/last_run.txt

      - name: Commit updated reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/index.html docs/latest.csv docs/last_run.txt
          git commit -m "Update automatic stock scanner report" || echo "No report changes to commit"
          git push
