name: AURORA V8.9.6 Dry Run Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engines/dry_run_execution_engine.py"
      - "engines/aurora_run_mode_engine.py"
      - "engines/market_data_quality_gate.py"
      - "tests/test_v8_9_6_dry_run_gate.py"
      - "config/aurora_runtime.env.example"
      - "docs/AURORA_G4_DRY_RUN.md"
      - ".github/workflows/dry_run_safety.yml"
  push:
    paths:
      - "engines/dry_run_execution_engine.py"
      - "engines/aurora_run_mode_engine.py"
      - "engines/market_data_quality_gate.py"
      - "tests/test_v8_9_6_dry_run_gate.py"
      - "config/aurora_runtime.env.example"
      - "docs/AURORA_G4_DRY_RUN.md"
      - ".github/workflows/dry_run_safety.yml"

permissions:
  contents: read

jobs:
  dry-run-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile G4 components
        run: |
          python -m py_compile engines/dry_run_execution_engine.py
          python -m py_compile engines/aurora_run_mode_engine.py
          python -m py_compile engines/market_data_quality_gate.py
          python -m py_compile tests/test_v8_9_6_dry_run_gate.py

      - name: Validate safe defaults
        run: |
          grep -q '^AURORA_DRY_RUN_MAX_ORDER_NOTIONAL_USD=100$' config/aurora_runtime.env.example
          grep -q '^AURORA_DRY_RUN_MAX_DAILY_GROSS_NOTIONAL_USD=500$' config/aurora_runtime.env.example
          grep -q '^AURORA_DRY_RUN_MAX_SPREAD_BPS=50$' config/aurora_runtime.env.example

      - name: Run G4 fail-closed tests
        env:
          AURORA_RUN_MODE: "SAFE_OFF"
        run: |
          python -m unittest tests.test_v8_9_6_dry_run_gate -v
