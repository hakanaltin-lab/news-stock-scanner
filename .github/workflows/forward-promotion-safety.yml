name: Forward promotion safety (read-only)

on:
  pull_request:
    paths:
      - 'tests/test_forward_promotion_report_safety.py'
      - 'tests/test_forward_journal_integrity.py'
      - 'tests/test_trading_session_calendar_boundaries.py'
      - 'docs/recommendation_journal.json'
      - 'docs/recommendation_performance.json'
      - 'docs/fresh_forward_promotion_gate.json'
      - '.github/workflows/forward-promotion-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-promotion-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline forward-promotion safety tests
        run: |
          python -m unittest discover -s tests -p 'test_forward_promotion_report_safety.py' -v
          python -m unittest discover -s tests -p 'test_forward_journal_integrity.py' -v
          python -m unittest discover -s tests -p 'test_trading_session_calendar_boundaries.py' -v
