name: AURORA V8.9.29 G4 Evidence Run Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/aurora_g4_shadow.py"
      - "scripts/run_aurora_g4_shadow.sh"
      - "engines/shadow_audit_ledger.py"
      - "scripts/aurora_readiness_summary.py"
      - "engines/dry_run_execution_engine.py"
      - "engines/market_data_quality_gate.py"
      - "tests/test_aurora_g4_shadow.py"
      - "tests/test_shadow_audit_ledger.py"
      - ".github/workflows/g4_runtime_shadow_safety.yml"
  push:
    paths:
      - "scripts/aurora_g4_shadow.py"
      - "scripts/run_aurora_g4_shadow.sh"
      - "engines/shadow_audit_ledger.py"
      - "scripts/aurora_readiness_summary.py"
      - "engines/dry_run_execution_engine.py"
      - "engines/market_data_quality_gate.py"
      - "tests/test_aurora_g4_shadow.py"
      - "tests/test_shadow_audit_ledger.py"
      - ".github/workflows/g4_runtime_shadow_safety.yml"

permissions:
  contents: read

jobs:
  g4-runtime-shadow-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and check shell
        run: |
          python -m py_compile scripts/aurora_g4_shadow.py
          python -m py_compile engines/shadow_audit_ledger.py
          python -m py_compile tests/test_aurora_g4_shadow.py
          python -m py_compile tests/test_shadow_audit_ledger.py
          bash -n scripts/run_aurora_g4_shadow.sh
      - name: Prove persistent broker-independent shadow behavior
        run: |
          python -m unittest tests.test_aurora_g4_shadow -v
          python -m unittest tests.test_shadow_audit_ledger -v
