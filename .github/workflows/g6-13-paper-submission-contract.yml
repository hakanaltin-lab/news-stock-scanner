name: G6.13 Paper Submission Contract Safety

on:
  pull_request:
    paths:
      - 'engines/paper_submission_contract.py'
      - 'tests/test_paper_submission_contract.py'
      - 'engines/paper_intent_preflight.py'
      - 'engines/paper_portfolio_risk.py'
      - 'engines/paper_order_authorization_gate.py'
      - 'docs/AURORA_G6_13_SUBMISSION_CONTRACT.md'
      - '.github/workflows/g6-13-paper-submission-contract.yml'
  push:
    branches:
      - aurora-g6-13-paper-submission-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test hard-disabled submission contract
        run: |
          python -m py_compile engines/paper_submission_contract.py tests/test_paper_submission_contract.py
          python -m unittest discover -s tests -p 'test_paper_submission_contract.py' -v
          if grep -Eq '(^|[[:space:]])(from|import)[[:space:]]+ibapi' engines/paper_submission_contract.py; then
            echo "Broker API import forbidden in G6.13 contract"
            exit 1
          fi
          if grep -q 'placeOrder' engines/paper_submission_contract.py; then
            echo "Broker order call forbidden in G6.13 contract"
            exit 1
          fi
