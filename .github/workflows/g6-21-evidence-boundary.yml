name: G6.21 offline evidence boundary

on:
  pull_request:
    paths:
      - 'tests/test_g6_21_readonly_evidence_boundary.py'
      - 'scripts/paper_readonly_acceptance_validator.py'
      - '.github/workflows/g6-21-evidence-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline fail-closed regression suite
        run: python -m unittest discover -s tests -p 'test_g6_21_readonly_evidence_boundary.py' -v
