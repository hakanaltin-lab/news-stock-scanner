name: AURORA G6 Correlation Guard
on:
  pull_request:
    paths:
      - 'engines/ibkr_gateway_connector.py'
      - 'engines/ibkr_correlation_guard.py'
      - 'tests/test_ibkr_correlation_guard.py'
      - 'engines/ibkr_snapshot_correlation_bridge.py'
      - 'tests/test_ibkr_snapshot_correlation_bridge.py'
      - 'tests/test_ibkr_correlation_review_regressions.py'
      - '.github/workflows/g6-correlation-guard.yml'
  push:
    branches:
      - aurora-g6-11-readonly-correlation
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated correlation guard tests
        run: |
          python -m unittest discover -s tests -p 'test_ibkr_correlation_guard.py' -v
          python -m unittest discover -s tests -p 'test_ibkr_snapshot_correlation_bridge.py' -v
          python -m unittest discover -s tests -p 'test_ibkr_correlation_review_regressions.py' -v
          python -m py_compile engines/ibkr_gateway_connector.py
