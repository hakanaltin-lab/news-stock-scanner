name: G7 IBKR Read-only Readiness Tests

on:
  pull_request:
    paths:
      - 'engines/ibkr_paper_readiness_engine.py'
      - 'tests/test_ibkr_readonly_readiness_g7.py'
      - '.github/workflows/g7-ibkr-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline readiness tests
        run: python -m unittest discover -s tests -p 'test_ibkr_readonly_readiness_g7.py' -v
