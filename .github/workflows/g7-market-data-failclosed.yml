name: G7.13 Execution Market Data Fail-Closed Safety

on:
  pull_request:
    paths:
      - "engines/market_data_quality_gate.py"
      - "tests/test_market_data_execution_gate_safety.py"
      - "tests/test_v8_9_5_safety_hardening.py"
      - "tests/test_g7_13_market_data_failclosed.py"
      - ".github/workflows/g7-market-data-failclosed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-market-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile execution market-data gate
        run: |
          python -m py_compile engines/market_data_quality_gate.py
          python -m py_compile tests/test_g7_13_market_data_failclosed.py

      - name: Prove G7.13 malformed data fails closed
        run: |
          python -m unittest tests.test_g7_13_market_data_failclosed -v
          python -m unittest tests.test_market_data_execution_gate_safety -v
          python -m unittest tests.test_v8_9_5_safety_hardening.MarketDataExecutionGateTests -v
