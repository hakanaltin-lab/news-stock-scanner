name: G8.23 Offline Materializer Review Handoff Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engines/offline_order_request_materializer_handoff.py"
      - "scripts/g6_offline_materializer_handoff.py"
      - "tests/test_offline_order_request_materializer_handoff.py"
      - "docs/AURORA_G8_23_OFFLINE_MATERIALIZER_HANDOFF.md"
      - ".github/workflows/g8_23_offline_materializer_handoff.yml"

permissions:
  contents: read

jobs:
  offline-materializer-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile G8.23 handoff components
        run: |
          python -m py_compile engines/offline_order_request_materializer_handoff.py
          python -m py_compile scripts/g6_offline_materializer_handoff.py
          python -m py_compile tests/test_offline_order_request_materializer_handoff.py

      - name: Prove review handoff is non-attesting and fail closed
        run: |
          python -m unittest tests.test_offline_order_request_materializer_handoff -v

      - name: Prove execution permissions remain false
        run: |
          python - <<'PY'
          from tests.test_offline_order_request_materializer_handoff import (
              OfflineMaterializerHandoffTests,
          )

          case = OfflineMaterializerHandoffTests()
          result = case.evaluate()
          assert result["ready_for_independent_materializer_review"] is True
          assert result["operator_asserts_materializer_safe"] is False
          assert result["unsigned_attestation_template"]["signature_b64"] is None
          for name in (
              "implementation_allowed",
              "connection_allowed",
              "broker_request_materialization_allowed",
              "broker_order_object_allowed",
              "automatic_retry_allowed",
              "automatic_cancel_allowed",
              "automatic_modify_allowed",
              "broker_submission_allowed",
              "paper_order_submission_allowed",
              "live_execution_allowed",
              "automatic_promotion_allowed",
              "real_money_trading_allowed",
          ):
              assert result[name] is False
          PY
