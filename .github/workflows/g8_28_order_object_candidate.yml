name: G8.28 Non-executable Order Object Candidate Safety
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "broker_engine/ibkr_order_object_materializer_candidate.py"
      - "engines/ibkr_order_object_candidate_review.py"
      - "scripts/g6_order_object_candidate_review.py"
      - "tests/test_ibkr_order_object_candidate.py"
      - ".github/workflows/g8_28_order_object_candidate.yml"
      - "docs/AURORA_G8_28_ORDER_OBJECT_CANDIDATE.md"
permissions:
  contents: read
jobs:
  candidate-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile review and test modules (candidate never imported)
        run: |
          python -m py_compile engines/ibkr_order_object_candidate_review.py
          python -m py_compile scripts/g6_order_object_candidate_review.py
          python -m py_compile tests/test_ibkr_order_object_candidate.py
      - name: Static source and fail-closed unit tests
        run: python -m unittest tests.test_ibkr_order_object_candidate -v
