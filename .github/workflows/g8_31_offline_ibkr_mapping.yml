name: G8.31 Offline IBKR Mapping Research Safety
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engines/ibkr_offline_order_object_mapping.py"
      - "tests/test_ibkr_offline_order_object_mapping.py"
      - ".github/workflows/g8_31_offline_ibkr_mapping.yml"
      - "docs/AURORA_G8_31_OFFLINE_IBKR_MAPPING.md"
permissions:
  contents: read
jobs:
  mapping-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile research engine, no broker imports
        run: |
          python -m py_compile engines/ibkr_offline_order_object_mapping.py
          python -m py_compile tests/test_ibkr_offline_order_object_mapping.py
      - name: Offline mapping and fail-closed safety tests
        run: python -m unittest tests.test_ibkr_offline_order_object_mapping -v
