name: IBKR read-only safety regression

on:
  pull_request:
    paths:
      - "engines/ibkr_gateway_connector.py"
      - "engines/ibkr_account_guard.py"
      - "engines/ibkr_paper_readiness_engine.py"
      - "engines/gateway_readonly_attestation_verifier.py"
      - "scripts/ibkr_paper_probe.py"
      - "scripts/verify_gateway_readonly_attestation.py"
      - "tests/test_ibkr_paper_read_only.py"
      - "tests/test_ibkr_account_guard_negative.py"
      - "tests/test_gateway_readonly_attestation_verifier.py"
      - ".github/workflows/ibkr-readonly-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AURORA_IBKR_ENABLED: "false"
      AURORA_IBKR_MODE: "PAPER"
      AURORA_RUN_MODE: "SAFE_OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test read-only connector, account guard and probe (offline)
        run: |
          python -m unittest discover -s tests -p test_ibkr_paper_read_only.py -v
          python -m unittest discover -s tests -p test_ibkr_account_guard_negative.py -v
          python -m unittest discover -s tests -p test_gateway_readonly_attestation_verifier.py -v
