name: AURORA Market Data Provenance Safety

on:
  pull_request:
    paths:
      - 'main.py'
      - 'engines/market_data_engine.py'
      - 'engines/market_data_quality_gate.py'
      - 'tests/test_market_snapshot_provenance.py'
      - 'tests/test_market_data_execution_gate_safety.py'
      - '.github/workflows/market-data-provenance-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Compile changed modules
        run: python -m py_compile main.py engines/market_data_engine.py engines/market_data_quality_gate.py
      - name: Run provenance and execution safety tests
        run: python -m unittest discover -s tests -p 'test_market_*safety.py' -v
      - name: Run snapshot provenance test
        run: python -m unittest discover -s tests -p 'test_market_snapshot_provenance.py' -v
