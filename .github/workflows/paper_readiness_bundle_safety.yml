name: AURORA V8.9.25 Paper Readiness Bundle Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/aurora_readiness_summary.py"
      - "scripts/run_aurora_g2_g3_readiness.sh"
      - "tests/test_aurora_readiness_summary.py"
      - "engines/ibkr_gateway_connector.py"
      - "engines/ibkr_market_data_connector.py"
      - "engines/ibkr_paper_readiness_engine.py"
      - ".github/workflows/paper_readiness_bundle_safety.yml"
  push:
    paths:
      - "scripts/aurora_readiness_summary.py"
      - "scripts/run_aurora_g2_g3_readiness.sh"
      - "tests/test_aurora_readiness_summary.py"
      - "engines/ibkr_gateway_connector.py"
      - "engines/ibkr_market_data_connector.py"
      - "engines/ibkr_paper_readiness_engine.py"
      - ".github/workflows/paper_readiness_bundle_safety.yml"

permissions:
  contents: read

jobs:
  readiness-bundle-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and check shell
        run: |
          python -m py_compile scripts/aurora_readiness_summary.py
          python -m py_compile tests/test_aurora_readiness_summary.py
          bash -n scripts/run_aurora_g2_g3_readiness.sh
      - name: Prove fail-closed bundle behavior
        run: python -m unittest tests.test_aurora_readiness_summary -v
