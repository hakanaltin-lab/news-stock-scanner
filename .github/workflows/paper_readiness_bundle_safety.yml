name: AURORA V8.9.28 Paper Readiness Bundle Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/aurora_readiness_summary.py"
      - "scripts/ibkr_paper_probe.py"
      - "scripts/ibkr_market_data_probe.py"
      - "scripts/run_aurora_g2_g3_readiness.sh"
      - "tests/test_ibkr_paper_read_only.py"
      - "tests/test_v8_9_7_ibkr_market_data.py"
      - "tests/test_aurora_readiness_summary.py"
      - "engines/ibkr_gateway_connector.py"
      - "engines/ibkr_market_data_connector.py"
      - "engines/ibkr_account_guard.py"
      - "engines/ibkr_paper_readiness_engine.py"
      - "tests/test_v8_9_5_safety_hardening.py"
      - ".github/workflows/paper_readiness_bundle_safety.yml"
  push:
    paths:
      - "scripts/aurora_readiness_summary.py"
      - "scripts/ibkr_paper_probe.py"
      - "scripts/ibkr_market_data_probe.py"
      - "scripts/run_aurora_g2_g3_readiness.sh"
      - "tests/test_ibkr_paper_read_only.py"
      - "tests/test_v8_9_7_ibkr_market_data.py"
      - "tests/test_aurora_readiness_summary.py"
      - "engines/ibkr_gateway_connector.py"
      - "engines/ibkr_market_data_connector.py"
      - "engines/ibkr_account_guard.py"
      - "engines/ibkr_paper_readiness_engine.py"
      - "tests/test_v8_9_5_safety_hardening.py"
      - ".github/workflows/paper_readiness_bundle_safety.yml"

permissions:
  contents: read

jobs:
  readiness-bundle-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and check shell
        run: |
          python -m py_compile scripts/aurora_readiness_summary.py
          python -m py_compile scripts/ibkr_paper_probe.py
          python -m py_compile scripts/ibkr_market_data_probe.py
          python -m py_compile engines/ibkr_account_guard.py
          python -m py_compile tests/test_aurora_readiness_summary.py
          bash -n scripts/run_aurora_g2_g3_readiness.sh
      - name: Prove fail-closed bundle behavior
        run: |
          python -m unittest \
            tests.test_aurora_readiness_summary \
            tests.test_ibkr_paper_read_only.IBKRProbeEntrypointTests \
            tests.test_v8_9_7_ibkr_market_data.IBKRMarketDataStaticSafetyTests \
            tests.test_v8_9_5_safety_hardening.PaperAccountGuardTests \
            -v
