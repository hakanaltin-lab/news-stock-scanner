name: SEC EDGAR PIT Fundamental Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "engines/sec_edgar_point_in_time_engine.py"
      - "engines/sec_archive_quality_engine.py"
      - "scripts/run_sec_edgar_pit_archive.py"
      - "scripts/audit_sec_semantic_contract.py"
      - "scripts/publish_sec_pit_evidence.sh"
      - "scripts/test_sec_edgar_pit_engine.py"
      - "tests/test_sec_archive_readiness.py"
      - "tests/test_sec_evidence_publish.py"
      - "docs/SEC_EDGAR_PIT_SETUP.md"
      - ".github/workflows/sec_edgar_pit_archive.yml"
  schedule:
    - cron: "15 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sec-edgar-pit-fundamental-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile SEC PIT foundation
        run: |
          python -m py_compile engines/sec_edgar_point_in_time_engine.py
          python -m py_compile scripts/run_sec_edgar_pit_archive.py
          python -m py_compile scripts/audit_sec_semantic_contract.py
          python -m py_compile scripts/test_sec_edgar_pit_engine.py
          python -m py_compile engines/sec_archive_quality_engine.py

      - name: Validate SEC PIT no-lookahead logic
        env:
          PYTHONPATH: .
        run: |
          python scripts/test_sec_edgar_pit_engine.py
          python -m unittest discover -s tests -p 'test_sec_archive_readiness.py' -v
          python -m unittest discover -s tests -p 'test_sec_evidence_publish.py' -v
          bash -n scripts/publish_sec_pit_evidence.sh

      # The runner enforces the SEC identity requirement and emits blocked
      # status before exiting, so the dashboard can publish the blocker.
      - name: Build SEC PIT archive
        id: archive
        env:
          PYTHONPATH: .
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/run_sec_edgar_pit_archive.py

      - name: Audit generated SEC semantic contract
        id: semantic_audit
        if: ${{ steps.archive.outcome == 'success' }}
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_sec_semantic_contract.py --require-clean

      - name: Preserve SEC evidence for recovery
        if: ${{ always() && steps.archive.outputs.status != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sec-pit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            data/sec_edgar_pit
            docs/sec_archive_readiness.json

      - name: Publish SEC PIT evidence
        # Publish truthful blocked/error status, but never publish a collected
        # archive that failed the post-collection semantic audit.
        if: ${{ always() && steps.archive.outputs.status != '' && (steps.archive.outcome != 'success' || steps.semantic_audit.outcome == 'success') }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          bash scripts/publish_sec_pit_evidence.sh
